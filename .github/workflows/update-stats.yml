name: Update Live GitHub Stats SVG

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch:      # Allows manual trigger from Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/update_stats.py'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Live Metrics and Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py

      - name: Commit and Push Updated Stats SVG
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/stats.svg
          if git diff --staged --quiet; then
            echo "No changes in stats SVG"
          else
            git commit -m "chore(stats): update live telemetry SVG [skip ci]"
            git push
          fi
