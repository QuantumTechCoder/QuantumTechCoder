<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="glowBorder4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff79c6" />
      <stop offset="100%" stop-color="#00f7ff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="416" height="156" rx="10" fill="url(#cardBg4)" stroke="url(#glowBorder4)" stroke-width="1.5" />

  <!-- Header & Icon -->
  <g transform="translate(20, 28)">
    <circle cx="10" cy="0" r="10" fill="#ff79c6" fill-opacity="0.15" />
    <text x="10" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ff79c6">📰</text>
    <text x="30" y="5" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" fill="#ffffff">ByteNews</text>
    
    <!-- Badge -->
    <rect x="245" y="-12" width="120" height="20" rx="4" fill="#301525" stroke="#ff79c6" stroke-width="1" />
    <text x="305" y="2" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#ff79c6" font-weight="bold">EDGE FULL-STACK</text>
  </g>

  <!-- Description -->
  <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#a0aec0">
    High-density, ultra-fast Hacker News platform built with Next.js
  </text>
  <text x="20" y="84" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#a0aec0">
    App Router, Cloudflare Pages, D1 SQL Edge &amp; Prisma ORM.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(20, 116)" font-family="'Fira Code', monospace" font-size="10">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#24101e" stroke="#522444" stroke-width="1" />
    <text x="30" y="14" text-anchor="middle" fill="#ff94d2">Next.js</text>

    <rect x="68" y="0" width="75" height="20" rx="4" fill="#24101e" stroke="#522444" stroke-width="1" />
    <text x="105" y="14" text-anchor="middle" fill="#ff94d2">Cloudflare D1</text>

    <rect x="150" y="0" width="55" height="20" rx="4" fill="#24101e" stroke="#522444" stroke-width="1" />
    <text x="177" y="14" text-anchor="middle" fill="#ff94d2">Prisma</text>

    <rect x="212" y="0" width="50" height="20" rx="4" fill="#24101e" stroke="#522444" stroke-width="1" />
    <text x="237" y="14" text-anchor="middle" fill="#ff94d2">Geist</text>

    <rect x="270" y="0" width="80" height="20" rx="4" fill="#24101e" stroke="#522444" stroke-width="1" />
    <text x="310" y="14" text-anchor="middle" fill="#00f7ff">TypeScript</text>
  </g>
</svg>
