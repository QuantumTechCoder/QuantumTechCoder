<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img">

<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="sglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".2"/></pattern>
</defs>


<style>
text { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.dim { fill: #6272a4; }
.cy { fill: #00d9ff; }
.fg { fill: #f8f8f2; }
.gr { fill: #50fa7b; }
.pk { fill: #ff79c6; }
.pp { fill: #bd93f9; }
.yl { fill: #f1fa8c; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes gm { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(4px,-1px); } 95% { transform: translate(-3px,1px); } 97% { transform: translate(2px,0); } }
@keyframes gc { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(-4px,1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-2px,0); } }
.cursor { animation: blink 1.05s step-end infinite; }
.dot { animation: pulse 2s ease-in-out infinite; }
.gm { animation: gm 5s linear 1s infinite; }
.gc { animation: gc 5s linear 1s infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="8" y="6" width="424" height="188" rx="8" fill="#050811" stroke="#ff79c6" stroke-width="1.5" stroke-opacity=".8"/>

<!-- Header -->
<text x="24" y="38" fill="#ffffff" font-weight="bold" font-size="17">ByteNews</text>
<rect x="290" y="22" width="126" height="22" rx="4" fill="#ff79c6" fill-opacity=".12" stroke="#ff79c6" stroke-width="1"/>
<text x="353" y="37" text-anchor="middle" fill="#ff79c6" font-weight="bold" font-size="9.5">EDGE FULL-STACK</text>

<!-- Descriptions -->
<text x="24" y="74" fill="#a0aec0" font-size="12">High-density, ultra-fast Hacker News platform.</text>
<text x="24" y="96" fill="#a0aec0" font-size="12">Built with Next.js App Router, Cloudflare D1 &amp; Prisma ORM.</text>

<!-- Tech Stack -->
<g transform="translate(24, 142)">

        <rect x="0" y="0" width="65" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="32.5" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Next.js</text>
        
        <rect x="73" y="0" width="107" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="126.5" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Cloudflare D1</text>
        
        <rect x="188" y="0" width="58" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="217.0" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Prisma</text>
        
        <rect x="254" y="0" width="51" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="279.5" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Geist</text>
        
</g>
</svg>