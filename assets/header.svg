<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f7ff" stroke-opacity="0.04" stroke-width="1.5" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px #00f7ff); }
        50% { opacity: 1; filter: drop-shadow(0 0 24px #00f7ff); }
      }
      @keyframes scanMotion {
        0% { transform: translateY(-10px); opacity: 0; }
        15% { opacity: 0.7; }
        85% { opacity: 0.7; }
        100% { transform: translateY(250px); opacity: 0; }
      }
      @keyframes circuitDash {
        to { stroke-dashoffset: -100; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes glitchText {
        0%, 92%, 100% { transform: translate(0, 0); }
        93% { transform: translate(-2px, 1px); }
        95% { transform: translate(2px, -1px); }
        97% { transform: translate(-1px, 2px); }
      }
      .circuit-line {
        stroke-dasharray: 8 6;
        animation: circuitDash 6s linear infinite;
      }
      .scanner-beam {
        animation: scanMotion 4.5s ease-in-out infinite;
      }
      .cursor {
        animation: cursorBlink 1s infinite;
      }
      .brand-title {
        font-family: 'Segoe UI', system-ui, -apple-system, monospace, sans-serif;
        font-weight: 900;
        letter-spacing: 4px;
        animation: glitchText 7s infinite;
      }
      .tagline {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        letter-spacing: 2.5px;
      }
      .chip-border {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" stroke="#1a2638" stroke-width="1.5" />
  
  <!-- Subtle Grid overlay -->
  <rect width="900" height="240" rx="16" fill="url(#scanlines)" />

  <!-- Background Animated Circuit Traces -->
  <g opacity="0.35">
    <path d="M 0 50 L 120 50 L 160 90 L 320 90" fill="none" stroke="#00f7ff" stroke-width="1.2" class="circuit-line" />
    <path d="M 900 190 L 780 190 L 740 150 L 580 150" fill="none" stroke="#bd93f9" stroke-width="1.2" class="circuit-line" />
    <path d="M 30 240 L 30 180 L 80 130 L 180 130" fill="none" stroke="#00ff9f" stroke-width="1" class="circuit-line" />
    <path d="M 870 0 L 870 60 L 820 110 L 720 110" fill="none" stroke="#ff79c6" stroke-width="1" class="circuit-line" />
    
    <!-- Node Terminals -->
    <circle cx="320" cy="90" r="3" fill="#00f7ff" />
    <circle cx="580" cy="150" r="3" fill="#bd93f9" />
    <circle cx="180" cy="130" r="2.5" fill="#00ff9f" />
    <circle cx="720" cy="110" r="2.5" fill="#ff79c6" />
  </g>

  <!-- Animated Laser Scan Beam -->
  <line x1="10" y1="0" x2="890" y2="0" stroke="url(#bgGrad)" stroke-width="3" />
  <g class="scanner-beam">
    <line x1="20" y1="0" x2="880" y2="0" stroke="#00f7ff" stroke-width="1.5" opacity="0.6" filter="url(#cyanGlow)" />
  </g>

  <!-- Glowing Central HUD Frame -->
  <rect x="40" y="24" width="820" height="192" rx="12" fill="#0b111e" fill-opacity="0.65" stroke="#00f7ff" stroke-width="1.5" stroke-opacity="0.5" class="chip-border" />
  
  <!-- Corner Tech Accents -->
  <path d="M 40 44 L 40 24 L 60 24" fill="none" stroke="#00f7ff" stroke-width="3" />
  <path d="M 860 44 L 860 24 L 840 24" fill="none" stroke="#00f7ff" stroke-width="3" />
  <path d="M 40 196 L 40 216 L 60 216" fill="none" stroke="#00f7ff" stroke-width="3" />
  <path d="M 860 196 L 860 216 L 840 216" fill="none" stroke="#00f7ff" stroke-width="3" />

  <!-- Top Status Bar in HUD -->
  <g font-family="'Fira Code', monospace" font-size="11" fill="#6272a4">
    <text x="64" y="50" fill="#00ff9f">● SYSTEM ONLINE</text>
    <text x="210" y="50">WORKSPACE: ANTIGRAVITY</text>
    <text x="440" y="50">KERNEL: LINUX / DEBIAN</text>
    <text x="730" y="50" fill="#00f7ff">SEC_LEVEL: 0x00</text>
  </g>

  <line x1="56" y1="62" x2="844" y2="62" stroke="#1f2d42" stroke-width="1" />

  <!-- Main Animated Brand Title -->
  <g transform="translate(450, 118)" text-anchor="middle">
    <!-- Drop Shadow / Glow duplicate -->
    <text class="brand-title" x="0" y="0" font-size="34" fill="#00f7ff" opacity="0.3" filter="url(#cyanGlow)">QUANTUM TECH CODER</text>
    <!-- Sharp Front Text -->
    <text class="brand-title" x="0" y="0" font-size="34" fill="#ffffff">QUANTUM TECH CODER</text>
  </g>

  <!-- Animated Dynamic Subtitle / Tagline -->
  <g transform="translate(450, 154)" text-anchor="middle">
    <text class="tagline" font-size="13.5" fill="#8be9fd">
      CODER <tspan fill="#ff79c6">·</tspan> ETHICAL HACKER <tspan fill="#ff79c6">·</tspan> AI ENGINEER <tspan fill="#ff79c6">·</tspan> SYSTEMS ARCHITECT
    </text>
  </g>

  <!-- Interactive Terminal Prompt Footer Line -->
  <g transform="translate(450, 188)" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12">
    <text fill="#50fa7b">&gt; root@quantum:~$ <tspan fill="#f8f8f2">build --break --understand --repeat</tspan><tspan fill="#00f7ff" class="cursor"> █</tspan></text>
  </g>

</svg>
