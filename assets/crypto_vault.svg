<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340">
  <defs>
    <linearGradient id="vaultBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="35%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#00ff9f" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes borderRotate {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      @keyframes copyHintGlow {
        0%, 100% { fill: #00f7ff; }
        50% { fill: #00ff9f; }
      }
      .animated-border {
        animation: borderRotate 12s linear infinite;
      }
      .beacon {
        animation: beaconBlink 2s ease-in-out infinite;
        transform-origin: 820px 48px;
      }
      .copy-hint {
        animation: copyHintGlow 3s ease-in-out infinite;
      }
      .addr-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 700;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Animated Outer Border -->
  <rect x="2" y="2" width="896" height="336" rx="16" fill="url(#vaultBg)" stroke="url(#borderGradient)" stroke-width="2.5" class="animated-border" />

  <!-- Top Vault Header -->
  <g transform="translate(40, 48)">
    <circle cx="0" cy="0" r="14" fill="#00f7ff" fill-opacity="0.15" />
    <path d="M -6 -7 L 6 -7 L 2 0 L 6 0 L -4 8 L -1 1 L -6 1 Z" fill="#00f7ff" />
    <text x="26" y="5" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" letter-spacing="1px">
      THE QUANTUM CRYPTO VAULT
    </text>
    <text x="315" y="5" font-family="'Fira Code', monospace" font-size="12" fill="#6272a4">
      // PROTOCOL: MULTI-CHAIN EVM
    </text>
  </g>

  <!-- Live Status Beacon -->
  <g class="beacon">
    <circle cx="820" cy="48" r="7" fill="#00ff9f" filter="url(#neonGlow)" />
  </g>
  <text x="805" y="52" text-anchor="end" font-family="'Fira Code', monospace" font-size="11" fill="#50fa7b">ONLINE</text>

  <line x1="40" y1="76" x2="860" y2="76" stroke="#1c283d" stroke-width="1.2" />

  <!-- Subtitle Message -->
  <text x="40" y="104" font-family="'Segoe UI', sans-serif" font-size="13.5" fill="#a0aec0">
    Fueling late-night debugging marathons, local LLM clusters, and open-source software tools.
  </text>

  <!-- Main Address Display Box -->
  <g transform="translate(40, 122)">
    <!-- Box Background -->
    <rect width="820" height="64" rx="10" fill="#050811" stroke="#25354e" stroke-width="1.5" />
    
    <!-- Left Icon / Chain Symbol -->
    <g transform="translate(24, 32)">
      <circle cx="0" cy="0" r="16" fill="#141c2e" stroke="#00f7ff" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="13" fill="#00f7ff">Ξ</text>
    </g>

    <!-- Address String -->
    <text x="56" y="29" font-family="'Fira Code', monospace" font-size="10" fill="#6272a4" letter-spacing="1px">UNIVERSAL EVM ADDRESS (ONE ADDRESS FOR ALL CHAINS):</text>
    <text x="56" y="49" class="addr-text" font-size="15.5" fill="#f8f8f2">0x2cef0473f985156eDe84312Ce0BeB94B602d26E4</text>

    <!-- Right Copy / Action Badge -->
    <g transform="translate(730, 20)">
      <rect width="70" height="25" rx="5" fill="#101929" stroke="#00f7ff" stroke-width="1" />
      <text x="35" y="16" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10.5" class="copy-hint" font-weight="bold">COPY</text>
    </g>
  </g>

  <!-- Networks & Tokens Supported Grid -->
  <g transform="translate(40, 214)">
    <text x="0" y="0" font-family="'Fira Code', monospace" font-size="11" fill="#8be9fd" font-weight="bold">SUPPORTED BLOCKCHAINS &amp; LAYER 2s:</text>
    
    <!-- Chain Badges Row 1 -->
    <g transform="translate(0, 12)" font-family="'Segoe UI', sans-serif" font-size="11.5">
      <!-- Ethereum -->
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#141926" stroke="#3d4d6b" stroke-width="1" />
      <text x="42" y="16" text-anchor="middle" fill="#f8f8f2">Ethereum</text>

      <!-- Arbitrum -->
      <rect x="95" y="0" width="80" height="24" rx="6" fill="#141926" stroke="#28a0f0" stroke-width="1" />
      <text x="135" y="16" text-anchor="middle" fill="#64b5f6">Arbitrum</text>

      <!-- Optimism -->
      <rect x="185" y="0" width="80" height="24" rx="6" fill="#141926" stroke="#ff0420" stroke-width="1" />
      <text x="225" y="16" text-anchor="middle" fill="#ff5252">Optimism</text>

      <!-- Base -->
      <rect x="275" y="0" width="65" height="24" rx="6" fill="#141926" stroke="#0052ff" stroke-width="1" />
      <text x="307" y="16" text-anchor="middle" fill="#448aff">Base</text>

      <!-- Polygon -->
      <rect x="350" y="0" width="105" height="24" rx="6" fill="#141926" stroke="#8247e5" stroke-width="1" />
      <text x="402" y="16" text-anchor="middle" fill="#b388ff">Polygon (POL)</text>

      <!-- BNB Chain -->
      <rect x="465" y="0" width="85" height="24" rx="6" fill="#141926" stroke="#f0b90b" stroke-width="1" />
      <text x="507" y="16" text-anchor="middle" fill="#ffd54f">BNB Chain</text>

      <!-- Avalanche -->
      <rect x="560" y="0" width="80" height="24" rx="6" fill="#141926" stroke="#e84142" stroke-width="1" />
      <text x="600" y="16" text-anchor="middle" fill="#ef5350">Avalanche</text>

      <!-- Linea / Scroll / Blast -->
      <rect x="650" y="0" width="170" height="24" rx="6" fill="#141926" stroke="#00ff9f" stroke-width="1" />
      <text x="735" y="16" text-anchor="middle" fill="#00ff9f">Linea · Scroll · Blast · Metis</text>
    </g>

    <!-- Token Badges Row 2 -->
    <g transform="translate(0, 48)" font-family="'Fira Code', monospace" font-size="10.5">
      <text x="0" y="14" fill="#6272a4">ACCEPTED ASSETS:</text>
      <text x="125" y="14" fill="#50fa7b">
        ETH, BNB, POL, AVAX, ARB, OP, USDC, USDT, DAI, WETH, WBTC &amp; All ERC-20 / BEP-20 Tokens
      </text>
    </g>

    <!-- Direct Explorer Link Note -->
    <g transform="translate(0, 78)" font-family="'Segoe UI', sans-serif" font-size="11">
      <text fill="#6272a4">
        🔒 Transactions verify on <tspan fill="#00f7ff">Etherscan</tspan>, <tspan fill="#00f7ff">Arbiscan</tspan>, <tspan fill="#00f7ff">Basescan</tspan>, and <tspan fill="#00f7ff">Polygonscan</tspan>. Gas-efficient L2 transfers warmly appreciated!
      </text>
    </g>
  </g>
</svg>
