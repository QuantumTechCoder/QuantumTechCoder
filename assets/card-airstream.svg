<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>
    <linearGradient id="glowBorder2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9f" />
      <stop offset="100%" stop-color="#00f7ff" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="416" height="156" rx="10" fill="url(#cardBg2)" stroke="url(#glowBorder2)" stroke-width="1.5" />

  <!-- Header & Icon -->
  <g transform="translate(20, 28)">
    <circle cx="10" cy="0" r="10" fill="#00ff9f" fill-opacity="0.15" />
    <text x="10" y="4" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#00ff9f">🚀</text>
    <text x="30" y="5" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="16" fill="#ffffff">AirStream</text>
    
    <!-- Badge -->
    <rect x="250" y="-12" width="115" height="20" rx="4" fill="#102b20" stroke="#00ff9f" stroke-width="1" />
    <text x="307" y="2" text-anchor="middle" font-family="'Fira Code', monospace" font-size="9" fill="#00ff9f" font-weight="bold">WEBRTC P2P</text>
  </g>

  <!-- Description -->
  <text x="20" y="66" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#a0aec0">
    Zero-limit peer-to-peer file transfer, live synchronized clipboard
  </text>
  <text x="20" y="84" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#a0aec0">
    &amp; collaborative workspace. Powered by Cloudflare Pages &amp; OPFS.
  </text>

  <!-- Tech Stack Pills -->
  <g transform="translate(20, 116)" font-family="'Fira Code', monospace" font-size="10">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#082118" stroke="#124a35" stroke-width="1" />
    <text x="30" y="14" text-anchor="middle" fill="#69f0ae">WebRTC</text>

    <rect x="68" y="0" width="75" height="20" rx="4" fill="#082118" stroke="#124a35" stroke-width="1" />
    <text x="105" y="14" text-anchor="middle" fill="#69f0ae">Cloudflare</text>

    <rect x="150" y="0" width="50" height="20" rx="4" fill="#082118" stroke="#124a35" stroke-width="1" />
    <text x="175" y="14" text-anchor="middle" fill="#69f0ae">OPFS</text>

    <rect x="208" y="0" width="80" height="20" rx="4" fill="#082118" stroke="#124a35" stroke-width="1" />
    <text x="248" y="14" text-anchor="middle" fill="#69f0ae">TypeScript</text>

    <rect x="296" y="0" width="55" height="20" rx="4" fill="#082118" stroke="#124a35" stroke-width="1" />
    <text x="323" y="14" text-anchor="middle" fill="#00f7ff">Workers</text>
  </g>
</svg>
