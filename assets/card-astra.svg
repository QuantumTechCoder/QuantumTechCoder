<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img">

<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00d9ff" stroke-opacity=".05"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="sglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
<pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity=".2"/></pattern>
</defs>


<style>
text { font-family: 'Fira Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.dim { fill: #6272a4; }
.cy { fill: #00d9ff; }
.fg { fill: #f8f8f2; }
.gr { fill: #50fa7b; }
.pk { fill: #ff79c6; }
.pp { fill: #bd93f9; }
.yl { fill: #f1fa8c; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
@keyframes gm { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(4px,-1px); } 95% { transform: translate(-3px,1px); } 97% { transform: translate(2px,0); } }
@keyframes gc { 0%, 92%, 100% { transform: translate(0,0); } 93% { transform: translate(-4px,1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-2px,0); } }
.cursor { animation: blink 1.05s step-end infinite; }
.dot { animation: pulse 2s ease-in-out infinite; }
.gm { animation: gm 5s linear 1s infinite; }
.gc { animation: gc 5s linear 1s infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<rect x="8" y="6" width="424" height="188" rx="8" fill="#050811" stroke="#bd93f9" stroke-width="1.5" stroke-opacity=".8"/>

<!-- Header -->
<text x="24" y="38" fill="#ffffff" font-weight="bold" font-size="17">AstraForxBrowser</text>
<rect x="290" y="22" width="126" height="22" rx="4" fill="#bd93f9" fill-opacity=".12" stroke="#bd93f9" stroke-width="1"/>
<text x="353" y="37" text-anchor="middle" fill="#bd93f9" font-weight="bold" font-size="9.5">CYBERPUNK DESKTOP</text>

<!-- Descriptions -->
<text x="24" y="74" fill="#a0aec0" font-size="12">High-octane browser engineered for terminal power users.</text>
<text x="24" y="96" fill="#a0aec0" font-size="12">Obsidian dark styling, CLI omnibox &amp; isolated incognito.</text>

<!-- Tech Stack -->
<g transform="translate(24, 142)">

        <rect x="0" y="0" width="72" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="36.0" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Electron</text>
        
        <rect x="80" y="0" width="72" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="116.0" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">Chromium</text>
        
        <rect x="160" y="0" width="86" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="203.0" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">JavaScript</text>
        
        <rect x="254" y="0" width="37" height="20" rx="4" fill="#08101e" stroke="#1d2e47" stroke-width="1"/>
        <text x="272.5" y="14" text-anchor="middle" fill="#8be9fd" font-size="10">CLI</text>
        
</g>
</svg>